# ============================================================
# Clash Verge Rev 本地配置：双订阅合并 + 精简分流
# 适用版本：v2.5.x
# 使用方法：
#   1. Clash Verge Rev → Profiles（订阅）→ + → 新建 Local（本地配置）
#   2. 把本文件内容全部粘贴进去，保存
#   3. 点击启用（激活）该配置
#   4. 右键该配置 → 更新代理集 / 更新规则集
# 节点更新：proxy-providers 的 interval（秒）控制自动拉取
# ============================================================

# ============================================================
# 订阅变量区（修改订阅只需改这里）
# ⚠️ SUB1_TOKEN / SUB2_TOKEN 替换为你的订阅 token（地址末尾加 &flag=clash 转 Clash 格式）
# ============================================================
x-订阅1: &sub1-url ''
x-订阅2: &sub2-url ''
x-hc: &hc
  enable: true
  url: http://www.gstatic.com/generate_204
  interval: 300

mixed-port: 1028
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true

# ---------------- DNS ----------------
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 114.114.114.114

# ---------------- 订阅合并（两个订阅源） ----------------
proxy-providers:
  订阅1:
    type: http
    url: *sub1-url
    interval: 3600
    path: ./proxy_provider/sub1.yaml
    health-check: *hc
  订阅2:
    type: http
    url: *sub2-url
    interval: 3600
    path: ./proxy_provider/sub2.yaml
    health-check: *hc

