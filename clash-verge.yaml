# ---------------- 代理组 ----------------
proxy-groups:
  # ===== 基础分组 =====
  # 手动选择：两个订阅所有节点
  - name: 🤖 AI自动
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    use:
      - 订阅1
      - 订阅2
    filter: '美国|US|United States|新加坡|狮城|SG|Singapore|GPT|Gemini'

  - name: 🧚 AI服务
    type: select
    proxies:
      - 🤖 AI自动
      - 🇺🇸 美国节点
      - 🇸🇬 新加坡
      - ✈️ 手动选择

  - name: 🚀 国外流量
    type: select
    proxies:
      - ♻️ 自动选择
      - 🔯 故障转移
      - ✈️ 手动选择

  - name: 🎯 国内流量
    type: select
    proxies:
      - DIRECT
      - ♻️ 自动选择
      - ✈️ 手动选择

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 国外流量
      - DIRECT
      - ✈️ 手动选择

  - name: ✈️ 手动选择
    type: select
    use:
      - 订阅1
      - 订阅2

  # 自动选择：自动测速，排除信息行 / 运营商节点
  - name: ♻️ 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - 订阅1
      - 订阅2
    exclude-filter: '剩余|流量|套餐|到期|过滤|电信|联通|移动|官网|客服'

  # 故障转移：自动选择挂了之后按顺序切换
  - name: 🔯 故障转移
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 600
    use:
      - 订阅1
      - 订阅2
    exclude-filter: '剩余|流量|套餐|到期|过滤|电信|联通|移动|官网|客服'

  # ===== 地区分组（按节点名正则匹配，自动归组） =====
  - name: 🛑 广告拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🇭🇰 香港节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - 订阅1
      - 订阅2
    filter: '香港|HK|Hong Kong|HongKong|澳门|MO|Macau'

  - name: 🇺🇸 美国节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - 订阅1
      - 订阅2
    filter: '美国|US|United States|LA'

  - name: 🇸🇬 新加坡
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - 订阅1
      - 订阅2
    filter: '新加坡|狮城|SG|Singapore|shiche'

  - name: 🇯🇵 日本节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - 订阅1
      - 订阅2
    filter: '日本|JP|Japan'

  - name: 🇨🇳 台湾节点
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - 订阅1
      - 订阅2
    filter: '台湾|TW|Taiwan'

  # 其他地区：排除所有已分组的地区
  - name: 🌍 其他地区
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - 订阅1
      - 订阅2
    exclude-filter: '香港|HK|Hong Kong|HongKong|澳门|MO|Macau|新加坡|狮城|SG|Singapore|shiche|日本|JP|Japan|美国|US|United States|LA|台湾|TW|Taiwan|剩余|流量|套餐|到期|过滤'

  # ===== 业务分组 =====
  # AI 自动：优先美/新节点（AI 服务解锁）
# ---------------- 分流规则（引用上面定义的规则集） ----------------
rules:
  # 局域网直连
  - RULE-SET,lan,DIRECT,no-resolve

  # 广告拦截
  - RULE-SET,ad,🛑 广告拦截

  # 补充规则（本仓库）
  - RULE-SET,replenish,DIRECT

  # AI 服务
  - RULE-SET,ai,🧚 AI服务
  - RULE-SET,gemini,🧚 AI服务
  - RULE-SET,claude,🧚 AI服务
  - RULE-SET,openai,🧚 AI服务
  - RULE-SET,copilot,🧚 AI服务

  # 通讯
  - RULE-SET,telegram,🚀 国外流量

  # 流媒体 / 国外常用
  - RULE-SET,youtube,🚀 国外流量
  - RULE-SET,discord,🚀 国外流量
  - RULE-SET,netflix,🚀 国外流量
  - RULE-SET,github,🚀 国外流量

  # 国内直连
  - RULE-SET,direct,🎯 国内流量
  - RULE-SET,chinamax,🎯 国内流量
  - RULE-SET,douyin,🎯 国内流量
  - RULE-SET,youku,🎯 国内流量
  - RULE-SET,apifox,🎯 国内流量

  # 国内 IP 兜底
  - GEOIP,CN,DIRECT

  # 国外流量兜底
  - RULE-SET,global,🚀 国外流量
  - RULE-SET,google,🚀 国外流量

  # 漏网之鱼
  - MATCH,🐟 漏网之鱼
